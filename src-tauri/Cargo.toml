[package]
name = "rustpilot"
version = "0.1.0"
description = "A focused desktop AI agent"
authors = ["RustPilot contributors"]
edition = "2021"

[lib]
name = "rustpilot_lib"
crate-type = ["rlib"]
test = false

[[bin]]
name = "rustpilot"
path = "src/main.rs"
test = false

[[test]]
name = "core_smoke"
path = "tests/core_smoke.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.8.1", features = [] }
tauri-runtime = "=2.8.0"
tauri-runtime-wry = "=2.8.0"
toml = "0.9.12"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
